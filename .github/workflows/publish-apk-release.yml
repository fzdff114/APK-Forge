name: Publish APK Release

on:
  # First publication is triggered by adding this workflow.
  # Future releases can be started manually from the Actions tab.
  push:
    paths:
      - ".github/workflows/publish-apk-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and prepare release files
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p release-files
          cp "$APK" "release-files/APK-Forge-v0.1.0-debug.apk"
          cd release-files
          sha256sum APK-Forge-v0.1.0-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: APK Forge v0.1.0
          target_commitish: main
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## APK Forge v0.1.0

            First public debug APK build.

            - Android package: `com.apkforge`
            - Minimum Android version: Android 8.0 (API 26)
            - Target Android SDK: 35
            - Build type: Debug (installable test build)
            - Includes the APK Forge Android app; repository-side AI coding tools remain in the source repository and are not embedded as AI chat/API features in the APK.

            See `SHA256SUMS.txt` to verify the APK download.
          files: |
            release-files/APK-Forge-v0.1.0-debug.apk
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
