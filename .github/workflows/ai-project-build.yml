name: Build AI generated Android project

on:
  workflow_dispatch:
    inputs:
      project_directory:
        description: Repository directory containing the Android Gradle project
        required: true
        default: generated-project

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Require Private repository for user project source
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPOSITORY: "${{ github.repository }}"
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["REPOSITORY"],
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              repository = json.load(response)
          if not repository.get("private", False):
              raise SystemExit(
                  "This build workflow refuses Public repositories. "
                  "Move the generated Android project and workflow to a Private repository."
              )
          print("Private repository confirmed.")
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Validate selected project directory
        id: project
        env:
          PROJECT_DIRECTORY: "${{ inputs.project_directory }}"
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target = (workspace / os.environ["PROJECT_DIRECTORY"]).resolve()
          if target == workspace or workspace not in target.parents:
              raise SystemExit("Project directory must be a subdirectory of the repository")
          if not target.is_dir():
              raise SystemExit(f"Project directory does not exist: {target}")
          if not ((target / "settings.gradle").is_file() or (target / "settings.gradle.kts").is_file()):
              raise SystemExit("Project directory has no settings.gradle(.kts)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"root={target}\n")
          PY

      - name: Scan generated project
        working-directory: ${{ github.workspace }}
        env:
          PROJECT_ROOT: "${{ steps.project.outputs.root }}"
        run: |
          python3 tools/apkforge.py scan --project "$PROJECT_ROOT" --format markdown

      - name: Build APK
        working-directory: ${{ github.workspace }}
        env:
          PROJECT_ROOT: "${{ steps.project.outputs.root }}"
        run: |
          python3 tools/apkforge.py build --project "$PROJECT_ROOT" --confirm-gradle-code --timeout 3600 --output "$RUNNER_TEMP/apkforge-build.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-generated-android-apk
          path: ${{ steps.project.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-generated-android-build-report
          path: ${{ runner.temp }}/apkforge-build.json
          if-no-files-found: ignore
          retention-days: 7
