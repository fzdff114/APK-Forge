name: APK Forge CI

on:
  push:
    branches:
      - main
      - local-first-prompt-builder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apkforge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout APK Forge
        uses: actions/checkout@v6
      - name: Test repository-side AI tools
        run: |
          python3 --version
          python3 -m py_compile tools/apkforge.py tools/apkforge_mcp.py
          python3 -m unittest discover -s tools/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found at $SDKMANAGER"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build APK Forge
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK Forge debug APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-forge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
