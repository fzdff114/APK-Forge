name: Build MNN Chat with local file-manager model import

on:
  push:
    branches:
      - mnn-chat-local-file-import
      - mnn-chat-conversion-diagnostics
    paths:
      - ".github/workflows/mnn-chat-file-import-build.yml"
      - ".apkforge/mnn-chat-local-import/**"

permissions:
  contents: read

concurrency:
  group: mnn-chat-local-file-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mnn-chat:
    name: Build MNN Chat 0.8.6 (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout APK Forge build scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Validate MNN patch script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/apply_patch.py"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Clone official Alibaba MNN source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/alibaba/MNN.git "$RUNNER_TEMP/MNN"
          echo "MNN_SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/MNN" rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/MNN" log -1 --oneline

      - name: Apply local model file-manager import
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/MNN"
          python3 "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/apply_patch.py"
          APP_ROOT="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat"
          python3 - "$APP_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          gradle = root / "app/build.gradle"
          source = gradle.read_text(encoding="utf-8")
          replacements = [
              ('applicationId "com.alibaba.mnnllm.android"',
               'applicationId "com.alibaba.mnnllm.android.localimport"'),
              ("versionCode 830", "versionCode 834"),
              ('versionName "0.8.3"', 'versionName "0.8.6-native-coherent"'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one Gradle identity anchor: {old}")
              source = source.replace(old, new, 1)
          gradle.write_text(source, encoding="utf-8")

          for relative, app_name in [
              ("app/src/main/res/values-zh-rCN/strings.xml", "MNN Chat 模型诊断版"),
              ("app/src/main/res/values/strings.xml", "MNN Chat - Conversion Diagnostics"),
          ]:
              path = root / relative
              text = path.read_text(encoding="utf-8")
              old = '<string name="app_name">MNN Chat</string>'
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one app_name anchor in {relative}")
              path.write_text(text.replace(old, f'<string name="app_name">{app_name}</string>', 1),
                              encoding="utf-8")
          print("Variant identity set to com.alibaba.mnnllm.android.localimport (install alongside stock app).")
          PY

      - name: Build MNN runtime from the same source revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/MNN/project/android"
          mkdir -p build_64
          cd build_64
          ../build_64.sh \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON \
            -DMNN_BUILD_LLM=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_ARM82=ON \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_OPENCL=ON \
            -DLLM_SUPPORT_VISION=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DLLM_SUPPORT_AUDIO=ON \
            -DMNN_BUILD_AUDIO=ON \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_SEP_BUILD=OFF \
            -DBUILD_PLUGIN=ON \
            -DMNN_QNN=OFF \
            -DMNN_HEXAGON=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 \
            -DCMAKE_INSTALL_PREFIX=.
          make install
          LIB="$RUNNER_TEMP/MNN/project/android/build_64/lib/libMNN.so"
          test -s "$LIB" || { echo "::error::Source-matched libMNN.so was not produced"; exit 1; }
          sha256sum "$LIB"
          echo "MNN_RUNTIME_SHA256=$(sha256sum "$LIB" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "MNN runtime built from source commit $MNN_SOURCE_COMMIT"

      - name: Verify Sherpa JNI dependency source is not shadowed by an old APK
        shell: bash
        run: |
          set -euo pipefail
          SHERPA="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/libsherpa-mnn-jni.so"
          if [ -e "$SHERPA" ]; then
            echo "::error::Unexpected pre-existing Sherpa JNI binary would bypass the project's 16KB-compatible download task"
            exit 1
          fi
          echo "Sherpa JNI will be fetched by downloadSherpaMnn.gradle (16KB-compatible package)."

      - name: Run Android unit tests
        working-directory: ${{ runner.temp }}/MNN/apps/Android/MnnLlmChat
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" testStandardDebugUnitTest --tests "com.alibaba.mnnllm.android.modelist.GgufMetadataReaderTest" --tests "com.alibaba.mnnllm.android.modelist.LocalModelFormatInspectorTest" --tests "com.alibaba.mnnllm.android.modelist.LocalModelArchiveImporterTest" --tests "com.alibaba.mnnllm.android.modelist.LocalModelConversionManagerTest" --stacktrace
      - name: Build arm64-v8a APK
        working-directory: ${{ runner.temp }}/MNN/apps/Android/MnnLlmChat
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleStandardDebug --stacktrace
          APK="app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          test -s "$APK" || { echo "::error::APK output was not created"; exit 1; }
          sha256sum "$APK"
          echo "### MNN Chat 0.8.6 native-coherent build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source-matched libMNN SHA-256: `$MNN_RUNTIME_SHA256`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`$MNN_SOURCE_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: mnn-chat-0.8.6-native-coherent-arm64
          path: ${{ runner.temp }}/MNN/apps/Android/MnnLlmChat/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 14
