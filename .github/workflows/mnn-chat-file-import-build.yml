name: Build MNN Chat with local file-manager model import

on:
  push:
    branches:
      - mnn-chat-local-file-import
    paths:
      - ".github/workflows/mnn-chat-file-import-build.yml"
      - ".apkforge/mnn-chat-local-import/**"

permissions:
  contents: read

jobs:
  build-mnn-chat:
    name: Build MNN Chat 0.8.3 (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout APK Forge build scripts
        uses: actions/checkout@v6
        with:
          ref: mnn-chat-local-file-import

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Clone official Alibaba MNN source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/alibaba/MNN.git "$RUNNER_TEMP/MNN"
          echo "MNN_SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/MNN" rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/MNN" log -1 --oneline

      - name: Apply local model file-manager import
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/apply_patch.py"
          APP_ROOT="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat"
          python3 - "$APP_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          gradle = root / "app/build.gradle"
          source = gradle.read_text(encoding="utf-8")
          replacements = [
              ('applicationId "com.alibaba.mnnllm.android"',
               'applicationId "com.alibaba.mnnllm.android.localimport"'),
              ("versionCode 830", "versionCode 831"),
              ('versionName "0.8.3"', 'versionName "0.8.3-localimport"'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one Gradle identity anchor: {old}")
              source = source.replace(old, new, 1)
          gradle.write_text(source, encoding="utf-8")

          for relative, app_name in [
              ("app/src/main/res/values-zh-rCN/strings.xml", "MNN Chat 本地导入版"),
              ("app/src/main/res/values/strings.xml", "MNN Chat - Local Import"),
          ]:
              path = root / relative
              text = path.read_text(encoding="utf-8")
              old = '<string name="app_name">MNN Chat</string>'
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one app_name anchor in {relative}")
              path.write_text(text.replace(old, f'<string name="app_name">{app_name}</string>', 1),
                              encoding="utf-8")
          print("Variant identity set to com.alibaba.mnnllm.android.localimport (install alongside stock app).")
          PY

      - name: Reuse the official 0.8.3 MNN runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$RUNNER_TEMP/mnn_chat_0_8_3_official.apk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://meta.alicdn.com/data/mnn/apks/mnn_chat_0_8_3.apk" \
            --output "$BASE_APK"
          python3 - "$BASE_APK" "$RUNNER_TEMP/MNN" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          apk = Path(sys.argv[1])
          repo = Path(sys.argv[2])
          app = repo / "apps/Android/MnnLlmChat"
          destinations = {
              "lib/arm64-v8a/libMNN.so":
                  repo / "project/android/build_64/lib/libMNN.so",
              "lib/arm64-v8a/libsherpa-mnn-jni.so":
                  app / "app/src/main/jniLibs/arm64-v8a/libsherpa-mnn-jni.so",
          }
          with zipfile.ZipFile(apk) as archive:
              for member, target in destinations.items():
                  try:
                      data = archive.read(member)
                  except KeyError:
                      raise SystemExit(f"Official 0.8.3 APK is missing {member}")
                  if not data:
                      raise SystemExit(f"Official 0.8.3 APK contains an empty {member}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  print(f"Prepared {target.relative_to(repo)} ({len(data):,} bytes)")
          PY

      - name: Build arm64-v8a APK
        working-directory: ${{ runner.temp }}/MNN/apps/Android/MnnLlmChat
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleStandardDebug --stacktrace
          APK="app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          test -s "$APK" || { echo "::error::APK output was not created"; exit 1; }
          sha256sum "$APK"
          echo "### MNN Chat local-import build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`$MNN_SOURCE_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: mnn-chat-0.8.3-local-import-arm64
          path: ${{ runner.temp }}/MNN/apps/Android/MnnLlmChat/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 14
