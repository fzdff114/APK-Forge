name: Build MNN Chat 0.9.5 with verified DeepSeek import and original chat UI

on:
  push:
    branches:
      - mnn-chat-local-file-import
      - mnn-chat-conversion-diagnostics
      - mnn-chat-gguf-feature-improvements
    paths:
      - ".github/workflows/mnn-chat-file-import-build.yml"
      - ".apkforge/mnn-chat-local-import/**"

permissions:
  contents: read

concurrency:
  group: mnn-chat-local-file-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mnn-chat:
    name: Build MNN Chat 0.9.5 GGUF runtime (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout APK Forge build scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Validate MNN patch script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/apply_patch.py"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "ndk;29.0.13113456" \
            "cmake;3.22.1" \
            "cmake;3.31.6"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Clone official Alibaba MNN source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/alibaba/MNN.git "$RUNNER_TEMP/MNN"
          echo "MNN_SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/MNN" rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/MNN" log -1 --oneline

      - name: Clone pinned llama.cpp Android GGUF runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" init
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin 46eb1742db6d2caec1bfa848c5702b1bdcc815e5
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
          echo "LLAMA_CPP_SOURCE_DIR=$RUNNER_TEMP/llama.cpp" >> "$GITHUB_ENV"
          echo "LLAMA_CPP_SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/llama.cpp" log -1 --oneline
      - name: Apply local model file-manager import
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/MNN"
          python3 "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/apply_patch.py"
          APP_ROOT="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat"
          python3 - "$APP_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          checker = root / "app/src/main/java/com/alibaba/mnnllm/android/update/UpdateChecker.kt"
          source = checker.read_text(encoding="utf-8")

          # Remove the old online app-update check, version parser, popup and APK download code.
          start = source.index('    @SuppressLint("LogNotTimber")\n    fun checkForUpdates(')
          end = source.index("    private val versionName:", start)
          disabled_check = '''    @SuppressLint("LogNotTimber")
              fun checkForUpdates(context: Context, forceCheck: Boolean) {
                  Log.i(TAG, "Built-in app updater is disabled in this build.")
              }

          '''
          source = source[:start] + disabled_check + source[end:]

          # Disable the old installer and download-complete receiver as well.
          install_start = source.index("        fun installApk(")
          install_end = source.index("        fun registerDownloadReceiver(", install_start)
          source = source[:install_start] + '''        fun installApk(context: Context, downloadId: Long, fileUri: Uri? = null) {
                      Log.i(TAG, "Built-in app installer is disabled in this build.")
                  }

          ''' + source[install_end:]

          register_start = source.index("        fun registerDownloadReceiver(")
          # It is the final method in the companion object; replace through EOF and close both scopes.
          source = source[:register_start] + '''        fun registerDownloadReceiver(context: Context) {
                      Log.i(TAG, "Built-in app update receiver is disabled in this build.")
                  }

              }
          }
          '''
          checker.write_text(source, encoding="utf-8")
          print("Removed built-in update requests, comparison, popup/download, installer and receiver.")

          # Restore the official app display name in both locales.
          import re
          for relative in [
              "app/src/main/res/values/strings.xml",
              "app/src/main/res/values-zh-rCN/strings.xml",
          ]:
              resource = root / relative
              content = resource.read_text(encoding="utf-8")
              content, count = re.subn(
                  r'(<string\s+name="app_name">).*?(</string>)',
                  r'\1MNN Chat\2',
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f"Could not restore app_name in {relative}")
              resource.write_text(content, encoding="utf-8")
              print(f"Restored official app name in {relative}")

          # Keep the upstream MNN launcher icon unchanged, as requested.

          # These nested modules have separate buildscript repositories. Root settings do not
          # control their buildscript classpaths, which previously fell through to rate-limited Central.
          module_gradles = [
              root.parent.parent / "frameworks/mnn_tts/android/build.gradle",
              root.parent.parent / "frameworks/model_downloader/android/build.gradle",
          ]
          for gradle in module_gradles:
              gradle_text = gradle.read_text(encoding="utf-8")
              anchor = "    repositories {\n        google()\n        mavenCentral()\n    }"
              mirrored = """    repositories {
                          google()
                          maven { url 'https://repo.huaweicloud.com/repository/maven/' }
                          maven { url 'https://maven.aliyun.com/repository/google' }
                          maven { url 'https://maven.aliyun.com/repository/central' }
                          mavenCentral()
                      }"""
              if gradle_text.count(anchor) != 1:
                  raise SystemExit(f"Expected one buildscript repository block in {gradle}")
              gradle.write_text(gradle_text.replace(anchor, mirrored, 1), encoding="utf-8")
              print(f"Added Maven mirrors to {gradle}")
          PY
          APP_ROOT="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat"
          python3 - "$APP_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          gradle = root / "app/build.gradle"
          source = gradle.read_text(encoding="utf-8")
          replacements = [
              ('applicationId "com.alibaba.mnnllm.android"',
               'applicationId "com.alibaba.mnnllm.android.localimport095"'),
              ("versionCode 830", "versionCode 843"),
              ('versionName "0.8.3"', 'versionName "0.9.5"'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one Gradle identity anchor: {old}")
              source = source.replace(old, new, 1)
          gradle.write_text(source, encoding="utf-8")

          print("Variant package set to com.alibaba.mnnllm.android.localimport095 (preserves earlier app installs and their private data); app label stays MNN Chat.")

          PY

      - name: Integrate native GGUF runtime and restore original app branding
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/add_gguf_runtime.py" "$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat" "$RUNNER_TEMP/llama.cpp"
          python3 -m py_compile "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/add_gguf_runtime.py"
          grep -n 'LLAMA_SRC' "$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat/app/src/main/cpp/CMakeLists.txt"
          grep -n 'android:label="MNN Chat"' "$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat/app/src/main/AndroidManifest.xml"
      - name: Stage GGUF model library sources and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import" "$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          patch = Path(sys.argv[1])
          app = Path(sys.argv[2])
          source_root = patch / "src/main/java"
          target_root = app / "app/src/main/java"
          if not source_root.is_dir():
              raise SystemExit("GGUF model-library Java sources are missing")
          copied = []
          for source in source_root.rglob("*.kt"):
              relative = source.relative_to(source_root)
              target = target_root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied.append(relative.as_posix())
          if not copied:
              raise SystemExit("No GGUF model-library Java/Kotlin sources were staged")
          test_root = patch / "tests"
          target_tests = app / "app/src/test/java/com/alibaba/mnnllm/android/modelist"
          target_tests.mkdir(parents=True, exist_ok=True)
          test_files = sorted(test_root.glob("*.kt"))
          if not test_files:
              raise SystemExit("GGUF regression tests are missing")
          for source in test_files:
              shutil.copy2(source, target_tests / source.name)
          print("Staged model-library sources: " + ", ".join(copied))
          print("Staged regression tests: " + ", ".join(source.name for source in test_files))
          PY
      - name: Integrate GGUF backend into the original MNN Chat screen
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat"
          python3 -m py_compile "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/integrate_original_chat.py"
          python3 "$GITHUB_WORKSPACE/.apkforge/mnn-chat-local-import/integrate_original_chat.py" "$APP_ROOT"
          grep -n 'GgufChatSession' "$APP_ROOT/app/src/main/java/com/alibaba/mnnllm/android/chat/ChatPresenter.kt"
          grep -n 'isGgufSession' "$APP_ROOT/app/src/main/java/com/alibaba/mnnllm/android/chat/ChatActivity.kt"
      - name: Add Maven Central mirror fallback for CI
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat/settings.gradle"
          python3 - "$SETTINGS" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          anchor = "repositories {\n        mavenCentral()"
          replacement = """repositories {
                  gradlePluginPortal()
                  google()
                  maven { url 'https://repo.huaweicloud.com/repository/maven/' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
                  mavenCentral()"""
          if source.count(anchor) != 2:
              raise SystemExit(
                  f"Expected pluginManagement and dependencyResolution repositories, "
                  f"found {source.count(anchor)}"
              )
          path.write_text(source.replace(anchor, replacement), encoding="utf-8")
          print("Added Aliyun Google/Central/Gradle-plugin mirrors before upstream repositories.")
          PY
          grep -n "maven.aliyun.com" "$SETTINGS"

      - name: Remove unused Firebase Gradle plugin markers from standard debug build
        shell: bash
        run: |
          set -euo pipefail
          ROOT_GRADLE="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat/build.gradle"
          python3 - "$ROOT_GRADLE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          optional_plugins = [
              "id 'com.google.gms.google-services' version '4.4.4' apply false",
              "id 'com.google.firebase.crashlytics' version '3.0.3' apply false",
          ]
          for plugin in optional_plugins:
              if source.count(plugin) != 1:
                  raise SystemExit(f"Expected exactly one optional plugin declaration: {plugin}")
              source = source.replace(plugin, "// Optional Firebase plugin intentionally omitted in standard debug build.")
          path.write_text(source, encoding="utf-8")
          print("Firebase plugins omitted: ENABLE_FIREBASE defaults to false and no google-services.json is present.")
          PY

      - name: Build MNN runtime from the same source revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/MNN/project/android"
          mkdir -p build_64
          cd build_64
          ../build_64.sh \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON \
            -DMNN_BUILD_LLM=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_ARM82=ON \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_OPENCL=ON \
            -DLLM_SUPPORT_VISION=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DLLM_SUPPORT_AUDIO=ON \
            -DMNN_BUILD_AUDIO=ON \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_SEP_BUILD=OFF \
            -DBUILD_PLUGIN=ON \
            -DMNN_QNN=OFF \
            -DMNN_HEXAGON=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 \
            -DCMAKE_INSTALL_PREFIX=.
          make install
          LIB="$RUNNER_TEMP/MNN/project/android/build_64/lib/libMNN.so"
          test -s "$LIB" || { echo "::error::Source-matched libMNN.so was not produced"; exit 1; }
          sha256sum "$LIB"
          echo "MNN_RUNTIME_SHA256=$(sha256sum "$LIB" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "MNN runtime built from source commit $MNN_SOURCE_COMMIT"

      - name: Verify Sherpa JNI dependency source is not shadowed by an old APK
        shell: bash
        run: |
          set -euo pipefail
          SHERPA="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat/app/src/main/jniLibs/arm64-v8a/libsherpa-mnn-jni.so"
          if [ -e "$SHERPA" ]; then
            echo "::error::Unexpected pre-existing Sherpa JNI binary would bypass the project's 16KB-compatible download task"
            exit 1
          fi
          echo "Sherpa JNI will be fetched by downloadSherpaMnn.gradle (16KB-compatible package)."

      - name: Download and verify 16KB-compatible Sherpa JNI dependency
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$RUNNER_TEMP/MNN/apps/Android/MnnLlmChat"
          ZIP="$RUNNER_TEMP/libsherpa-mnn-jni-16k.zip"
          OUTPUT="$APP_ROOT/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUTPUT"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            "https://meta.alicdn.com/data/mnn/libs/libsherpa-mnn-jni-16k.zip" \
            --output "$ZIP"
          test -s "$ZIP" || { echo "::error::Sherpa JNI archive is empty"; exit 1; }
          python3 - "$ZIP" "$OUTPUT" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          with zipfile.ZipFile(archive) as bundle:
              bad_member = bundle.testzip()
              if bad_member:
                  raise SystemExit(f"Corrupt Sherpa JNI archive member: {bad_member}")
              native_members = [
                  item for item in bundle.infolist()
                  if not item.is_dir() and PurePosixPath(item.filename).suffix == ".so"
              ]
              matches = [item for item in native_members
                         if PurePosixPath(item.filename).name == "libsherpa-mnn-jni.so"]
              if len(matches) != 1:
                  raise SystemExit(
                      "Expected exactly one libsherpa-mnn-jni.so in archive; found "
                      + str(len(matches)) + "; members="
                      + ", ".join(item.filename for item in native_members)
                  )
              seen = set()
              for item in native_members:
                  name = PurePosixPath(item.filename).name
                  if name in seen:
                      raise SystemExit(f"Duplicate native library basename in Sherpa ZIP: {name}")
                  seen.add(name)
                  target = output / name
                  target.write_bytes(bundle.read(item))
                  if target.stat().st_size == 0:
                      raise SystemExit(f"Extracted an empty native library: {name}")
                  print(f"Installed {target} ({target.stat().st_size:,} bytes)")
          PY
          test -s "$OUTPUT/libsherpa-mnn-jni.so"
          sha256sum "$OUTPUT"/*.so
          echo "Sherpa JNI downloaded, ZIP-verified, and staged before Gradle."
 
      - name: Run Android unit tests
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}/MNN/apps/Android/MnnLlmChat
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          set +e
          timeout --signal=TERM --kill-after=20s 8m ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" testStandardDebugUnitTest --tests "com.alibaba.mnnllm.android.modelist.GgufMetadataReaderTest" --tests "com.alibaba.mnnllm.android.modelist.LocalModelFormatInspectorTest" --tests "com.alibaba.mnnllm.android.modelist.LocalModelArchiveImporterTest" --tests "com.alibaba.mnnllm.android.modelist.LocalModelConversionManagerTest" --tests "com.alibaba.mnnllm.android.modelist.LocalGgufModelLibraryTest" --tests "com.alibaba.mnnllm.android.modelist.GgufChatHistoryStoreTest" --stacktrace
          test_status=$?
          set -e
          if [ "$test_status" -eq 124 ] || [ "$test_status" -eq 137 ]; then
            echo "::warning::Android unit tests exceeded 8 minutes; continuing to independent APK compilation."
            echo "GGUF_ANDROID_TESTS_TIMEOUT=true" >> "$GITHUB_ENV"
            echo "### Android unit tests timed out; APK compilation will still validate the full Kotlin source." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          else
            echo "### Android unit tests passed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build arm64-v8a APK
        working-directory: ${{ runner.temp }}/MNN/apps/Android/MnnLlmChat
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleStandardDebug --stacktrace
          APK="app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          test -s "$APK" || { echo "::error::APK output was not created"; exit 1; }
          OUTPUT_APK="$RUNNER_TEMP/MNN_Chat_0.9.5_SideBySide_arm64.apk"
          cp "$APK" "$OUTPUT_APK"
          test -s "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK"
          echo "### MNN Chat 0.9.5 with verified DeepSeek import and original chat UI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source-matched libMNN SHA-256: $MNN_RUNTIME_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "- MNN source commit: $MNN_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "- llama.cpp source commit: $LLAMA_CPP_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct GGUF JNI library: libai-chat.so" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: mnn-chat-0.9.5-gguf-runtime-arm64
          path: ${{ runner.temp }}/MNN_Chat_0.9.5_SideBySide_arm64.apk
          if-no-files-found: error
          retention-days: 14
